services:
  postgres:
    image: postgres:16-alpine
    container_name: materias-postgres
    environment:
      POSTGRES_DB: materias_db
      POSTGRES_USER: materias_user
      POSTGRES_PASSWORD: materias_pass
    ports:
      - "5432:5432"
    volumes:
      - materias_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materias_user -d materias_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  materias_data:
