server:
  port: 3002
  shutdown: graceful
  tomcat:
    # Tomcat descarta (sin cortar la conexión) cuerpos rechazados de hasta este tamaño,
    # para que el cliente reciba el 413 en lugar de un "connection reset"
    max-swallow-size: 20MB

spring:
  application:
    name: materias-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:materias_db}
    username: ${DB_USERNAME:materias_user}
    password: ${DB_PASSWORD:materias_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Subida de contenido temático (PDF, máx. 10 MB)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      # Umbral por encima del máximo: el archivo se mantiene en memoria y nunca se escribe en disco
      file-size-threshold: 11MB

# AWS S3: obligatorias por variable de entorno (sin valores por defecto)
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  # Solo con credenciales temporales (AWS Academy / STS)
  session-token: ${AWS_SESSION_TOKEN:}
  region: ${AWS_REGION}
  bucket-name: ${AWS_BUCKET_NAME}
  # Solo para pruebas locales con un S3 compatible (MinIO/LocalStack); en AWS no se define
  s3-endpoint: ${AWS_S3_ENDPOINT:}

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator — solo health
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
